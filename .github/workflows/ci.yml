name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test and typecheck
        run: bun run check
      - name: Dependency audit
        run: bun audit
      - name: Public-tree privacy scan
        run: python3 scripts/check_public_tree.py
